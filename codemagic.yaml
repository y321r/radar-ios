# Radar iOS — Codemagic workflow (Compose Multiplatform / Kotlin Multiplatform)
# Two phases: (1) compile the Kotlin/Native framework — the first real gate for iosMain,
#             (2) build the Xcode app shell with xcodebuild (target-based, no scheme needed).
workflows:
  ios-build:
    name: Radar iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compile Kotlin/Native iOS framework (simulator, debug)
        script: |
          set -e
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain
      - name: Build iOS app (simulator, no signing)
        script: |
          set -e
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ../build-ios \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build-ios/Build/Products/Debug-iphonesimulator/*.app
      - composeApp/build/bin/iosSimulatorArm64/debugFramework/*.framework
    publishing:
      email:
        recipients:
          - a.aldhabab@gmail.com
        notify:
          success: true
          failure: true
