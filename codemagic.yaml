# Radar iOS — Codemagic workflows (Compose Multiplatform / Kotlin Multiplatform)
# Simulator workflow: runnable NOW, no Apple account needed.
# Device workflow: runnable NOW unsigned — proves the app builds for a real iPhone.
# Release workflow: commented — fill TEAM_ID etc. when the Apple Developer account arrives.
workflows:
  ios-build:
    name: Radar iOS (simulator)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compile Kotlin/Native iOS framework (simulator, debug)
        script: |
          set -e
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain
      - name: Build iOS app (simulator, no signing)
        script: |
          set -e
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ../build-ios \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build-ios/Build/Products/Debug-iphonesimulator/*.app
      - composeApp/build/bin/iosSimulatorArm64/debugFramework/*.framework
    publishing:
      email:
        recipients:
          - a.aldhabab@gmail.com
        notify:
          success: true
          failure: true

  ios-device:
    name: Radar iOS (device, unsigned)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compile Kotlin/Native iOS framework (device arm64, debug)
        script: |
          set -e
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --console=plain
      - name: Build iOS app (device, unsigned)
        script: |
          set -e
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ../build-ios-device \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build-ios-device/Build/Products/Debug-iphoneos/*.app
      - composeApp/build/bin/iosArm64/debugFramework/*.framework
    publishing:
      email:
        recipients:
          - a.aldhabab@gmail.com
        notify:
          success: true
          failure: true

