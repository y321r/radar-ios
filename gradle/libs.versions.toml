# Radar iOS — Kotlin Multiplatform scaffold
# Versions aligned with the Android project (Cloude code/radar) where the same
# library exists. Compose Multiplatform version must match the Kotlin version —
# verify against the CMP↔Kotlin compatibility matrix at first build.

[versions]
# agp pinned to 9.0.0: Kotlin 2.3.x KMP supports AGP only up to 9.0.0 (official
# compatibility table). The Android project's 9.3.1 is non-KMP and stays there.
agp = "9.0.0"
kotlin = "2.3.21"
ksp = "2.3.10"

composeMultiplatform = "1.11.1"
composeCompiler = "2.3.21"

coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
room = "2.8.4"
koin = "4.2.0"
datetime = "0.7.1"

androidxActivity = "1.13.0"
# 2.10.x, not 2.11: 2.11 requires AGP >= 9.1, but Kotlin 2.3.x KMP caps AGP at 9.0.
androidxLifecycle = "2.10.0"
browser = "1.10.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version = "0.2.6" }
coil = { module = "io.coil-kt.coil3:coil-compose", version = "3.5.0" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version = "3.5.0" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version = "2.7.0" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
